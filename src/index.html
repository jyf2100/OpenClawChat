<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoClaw 对话</title>
  <link rel="stylesheet" href="styles/chat.css">
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
  <!-- Highlight.js for code syntax highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏：连接列表 -->
    <aside class="connection-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">🔌 RoClaw</span>
        <button class="add-btn" id="addConnBtn" title="添加连接">+</button>
      </div>

      <!-- 房间分隔线 -->
      <div class="room-divider"></div>

      <div class="connection-list" id="connList">
        <!-- 连接项将通过 JS 动态插入 -->
      </div>

      <!-- 公共聊天房间项 -->
      <div class="room-item" id="publicRoomBtn" data-room="public">
        <span class="room-icon">🌐</span>
        <span class="room-name">公共聊天</span>
        <span class="room-badge">NEW</span>
      </div>
    </aside>

    <!-- 主聊天区域 -->
    <main class="chat-main">
      <div class="chat-content">
        <!-- 固定头部区域 -->
        <div class="header-fixed">
          <!-- 顶部导航栏 -->
          <div class="topbar">
            <div class="brand">
              <div class="brand-dot"></div>
              <span class="brand-title" id="currentConnTitle">RoClaw 对话</span>
            </div>
            <div class="topbar-right">
              <!-- 房间状态栏（仅公共聊天显示） -->
              <div class="room-status-bar" id="roomStatusBar" style="display: none;">
                <div class="participants-compact">
                  <span class="participants-label">参与:</span>
                  <span class="participants-count" id="participantsCount">0</span>
                  <button class="participants-add-btn" id="participantsAddBtn" title="添加参与者">+</button>
                  <button class="participants-remove-btn" id="participantsRemoveBtn" title="清空参与者">×</button>
                  <div class="participants-tooltip" id="participantsTooltip">
                    <!-- 参与者列表将通过 JS 动态插入 -->
                  </div>
                  <div class="participants-dropdown" id="participantsDropdown">
                    <!-- 可用连接列表将通过 JS 动态插入 -->
                  </div>
                </div>
                <label class="interaction-switch">
                  <input type="checkbox" id="aiInteractionToggle">
                  <span>AI交互</span>
                </label>
                <div class="loop-control">
                  <label class="loop-switch">
                    <input type="checkbox" id="conversationLoopToggle">
                    <span>循环</span>
                  </label>
                  <div class="loop-status" id="loopStatus" style="display: none;">
                    <span class="loop-rounds" id="loopRounds">0/10</span>
                    <button class="btn btn-mini" id="stopLoopBtn">停止</button>
                  </div>
                </div>
              </div>
              <!-- 连接状态（始终显示） -->
              <div class="status" id="status">
                <div class="status-dot"></div>
                <span class="status-text" id="statusText">未连接</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-thread" id="chatThread">
          <!-- 消息将通过 JS 动态插入 -->
        </div>

        <!-- 排队消息 -->
        <div class="queue" id="queue" style="display: none;">
          <span class="queue-title">排队中 (<span id="queueCount">0</span>)</span>
          <div class="queue-list" id="queueList">
            <!-- 队列项将通过 JS 动态插入 -->
          </div>
        </div>

        <!-- 提示消息 -->
        <div class="hint" id="hint" style="display: none;"></div>

        <!-- 底部输入栏 -->
        <div class="compose-fixed">
          <!-- 附件预览 -->
          <div class="attachments" id="attachments"></div>

          <!-- 输入框 -->
          <div class="input-wrapper">
            <textarea
              class="textarea"
              id="messageInput"
              placeholder="输入消息..."
              rows="1"
            ></textarea>
          </div>

          <!-- 操作按钮 -->
          <div class="compose-actions">
            <button class="btn btn-ghost" id="chooseImageBtn">+</button>
            <button class="btn btn-ghost" id="secondaryBtn">新会话</button>
            <button class="send-btn" id="sendBtn">发送</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- @提及补全菜单 -->
  <div class="mention-suggestions" id="mentionSuggestions" style="display: none;">
    <!-- 补全建议将通过 JS 动态插入 -->
  </div>

  <!-- 连接编辑弹窗 -->
  <div class="modal-overlay" id="connModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">添加连接</span>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <span class="label">名称 *</span>
          <input class="input" id="connName" placeholder="例如：生产环境" maxlength="20" />
        </div>
        <div class="field">
          <span class="label">网关 WS *</span>
          <input class="input" id="connGateway" placeholder="ws://127.0.0.1:18789" />
        </div>
        <div class="field">
          <span class="label">令牌</span>
          <input class="input" id="connToken" type="password" placeholder="可选" />
        </div>
        <div class="field">
          <span class="label">会话 *</span>
          <input class="input" id="connSession" placeholder="agent:main:main" />
        </div>
        <div class="field-errors" id="connErrors"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modalCancel">取消</button>
        <button class="btn btn-primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay" id="deleteModal" style="display: none;">
    <div class="modal" style="max-width: 400px;">
      <div class="modal-header">
        <span class="modal-title">确认删除</span>
        <button class="modal-close" id="deleteModalClose">×</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 16px;">确定要删除连接 <strong id="deleteConnName"></strong> 吗？</p>
        <p style="color: #cf222e; font-size: 14px;">⚠️ 此操作将删除该连接的所有聊天记录，无法恢复。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="deleteModalCancel">取消</button>
        <button class="btn btn-danger" id="deleteModalConfirm">删除</button>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu" style="display: none;">
    <div class="context-menu-item" data-action="edit">✏️ 编辑</div>
    <div class="context-menu-item" data-action="copy">📋 复制</div>
    <div class="context-menu-item" data-action="reconnect">🔄 重新连接</div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item context-menu-danger" data-action="delete">🗑️ 删除</div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/connectionManager.js"></script>
  <script src="js/roomManager.js"></script>
  <script src="js/messageRouter.js"></script>
  <script src="js/mentionAutocomplete.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
